name: Validate reader kit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Application, security and Chromium tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Run tests with real Chromium
        env:
          WPC_BROWSER_TESTS: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
        run: python -m unittest test_app test_security test_dashboard

  infrastructure:
    name: Compile infrastructure without deploying
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD 'deploy.ps1'), [ref]$tokens, [ref]$parseErrors
          )
          if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              exit 1
          }
